[project]
name = "practical-deliberation-llms"
version = "0.1.0"
description = "Probing Practical Deliberation in LLMs"
readme = "README.md"
authors = [
    { name = "Gregor Betz", email = "3662782+ggbetz@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chz>=0.4.0",
    "datasets>=3.2.0",
    "openai>=1.59.7",
    "pyyaml>=6.0.2",
    "seaborn>=0.13.2",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
legacy = [
    "arize-phoenix>=7.7.2",
    "langchain>=0.3,<0.4",
    "langchain-community>=0.3",
    "langchain-openai>=0.2,<0.3",
    "openinference-instrumentation-langchain>=0.1.29",
    "loguru>=0.7.3",
]

[project.scripts]
practical-deliberation-llms = "practical_deliberation_llms:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.7",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
